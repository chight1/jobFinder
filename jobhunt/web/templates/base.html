<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · jobhunt</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav>
    {% for href, name in [("/new", "New"), ("/all", "All open"), ("/removed", "Removed"),
                          ("/applied", "Applied"), ("/health", "Health")] %}
    <a href="{{ href }}"{% if title == name %} aria-current="page"{% endif %}>{{ name }}
      {%- if name in counts %} <span class="tab-count">{{ counts[name] }}</span>{% endif %}</a>
    {% endfor %}
  </nav>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
