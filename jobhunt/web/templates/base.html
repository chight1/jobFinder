<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · jobhunt</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav>
    <a href="/new" {% if title == "New" %}aria-current="page"{% endif %}>New</a>
    <a href="/all" {% if title == "All open" %}aria-current="page"{% endif %}>All open</a>
    <a href="/removed" {% if title == "Removed" %}aria-current="page"{% endif %}>Removed</a>
    <a href="/applied" {% if title == "Applied" %}aria-current="page"{% endif %}>Applied</a>
    <a href="/health" {% if title == "Health" %}aria-current="page"{% endif %}>Health</a>
  </nav>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
