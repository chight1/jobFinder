[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunt"
version = "0.1.0"
description = "Nightly job collection, filtering and ranking for one person's search"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",  # the lexbor parser; 1.0 removed the old modest one
    "feedparser>=6.0",
    "datasketch>=1.6",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",  # zoneinfo has no system time zone database on Windows
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8"]

[project.scripts]
jobhunt = "jobhunt.cli:main"

[tool.setuptools.packages.find]
include = ["jobhunt*"]

[tool.setuptools.package-data]
jobhunt = ["web/templates/*.html", "web/static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
