[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfinder"
version = "0.1.0"
description = "Nightly job collection, filtering and ranking for one person's search"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",  # the lexbor parser; 1.0 removed the old modest one
    "feedparser>=6.0",
    "datasketch>=1.6",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "tzdata>=2024.1",  # zoneinfo has no system time zone database on Windows
    "tomlkit>=0.13",  # edits profile.toml from the Skills page without losing its comments
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8", "ruff==0.17.2"]  # the ruff PR Verify runs

[project.scripts]
jobfinder = "jobfinder.cli:main"

[tool.setuptools.packages.find]
include = ["jobfinder*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "SIM905",  # a word list reads better as one string with .split() than as a long list literal
]

[tool.pytest.ini_options]
testpaths = ["tests"]
